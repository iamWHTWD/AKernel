# Replace namespace, target node image digest, scripts ConfigMap and configuration names.
# The executor image must equal upgrade.image; its rootfs is measured before upgrade.
# apply/resume/abort require --execute and the exact SDK version reported by plan.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akernel-node-upgrade
  namespace: akernel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: akernel-node-upgrade
  namespace: akernel
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [akernel-node]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, patch, delete]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: akernel-node-upgrade
  namespace: akernel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: akernel-node-upgrade
subjects:
  - kind: ServiceAccount
    name: akernel-node-upgrade
    namespace: akernel
---
# Node UID/pool/provider identity is read-only and cluster scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akernel-node-upgrade-node-reader
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: akernel-node-upgrade-akernel-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: akernel-node-upgrade-node-reader
subjects:
  - kind: ServiceAccount
    name: akernel-node-upgrade
    namespace: akernel
---
apiVersion: batch/v1
kind: Job
metadata:
  name: akernel-node-upgrade-plan
  namespace: akernel
  labels:
    app.kubernetes.io/name: akernel-node-upgrade
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akernel-node-upgrade
    spec:
      restartPolicy: Never
      serviceAccountName: akernel-node-upgrade
      # Private images: configure existing imagePullSecrets here or on the SA.
      # imagePullSecrets: [{name: existing-registry-credentials}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: executor
          image: registry.example/akernel-node@sha256:REPLACE_WITH_NODE_IMAGE_DIGEST
          command: [python3, '-S', /opt/akernel-upgrade/bootstrap.py]
          args: [plan, --config, /etc/akernel-upgrade/config.json]
          env:
            # Empty selects the latest SDK (including RC) for plan/status only.
            - {name: AKERNEL_SDK_VERSION, value: ''}
            - {name: TMPDIR, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - name: AKERNEL_UPGRADE_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: AKERNEL_UPGRADE_POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /opt/akernel-upgrade, readOnly: true}
            - {name: config, mountPath: /etc/akernel-upgrade, readOnly: true}
            - {name: credentials, mountPath: /run/akernel-upgrade, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: akernel-node-upgrade-scripts-REPLACE_WITH_CONTENT_HASH
        - name: config
          configMap:
            name: akernel-node-upgrade-config
        - name: credentials
          secret:
            secretName: akernel-node-upgrade-existing-credentials
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
